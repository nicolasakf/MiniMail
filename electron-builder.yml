appId: com.nicolasakf.minimail
productName: MiniMail
artifactName: ${productName}-${version}-mac-${arch}.${ext}
files:
  - out/**/*
  - package.json
extraResources:
  - LICENSE
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  forceCodeSigning: true
  notarize: true
dmg:
  sign: true
# Where installed copies look for a new version (UPDATE_FEED_URL in src/shared/updates.ts). This is what makes
# electron-builder write latest-mac.yml next to the zip; nothing is uploaded from here (--publish never).
publish:
  provider: generic
  url: https://github.com/nicolasakf/MiniMail/releases/latest/download
