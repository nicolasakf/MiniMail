name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:release
      - name: Sign and notarize the app and disk image
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Set the MACOS_CSC_LINK repository secret}"
          : "${CSC_KEY_PASSWORD:?Set the MACOS_CSC_KEY_PASSWORD repository secret}"
          : "${APPLE_API_KEY_CONTENTS:?Set the APPLE_API_KEY repository secret}"
          : "${APPLE_API_KEY_ID:?Set the APPLE_API_KEY_ID repository secret}"
          : "${APPLE_API_ISSUER:?Set the APPLE_API_ISSUER repository secret}"

          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/notarization.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          if [[ "$APPLE_API_KEY_CONTENTS" == '-----BEGIN PRIVATE KEY-----'* ]]; then
            printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY"
          else
            printf '%s' "$APPLE_API_KEY_CONTENTS" | base64 -D > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_CONTENTS

          npm run package:mac
          version="${GITHUB_REF_NAME#v}"
          app="dist/mac-arm64/MiniMail.app"
          dmg="dist/MiniMail-$version-mac-arm64.dmg"

          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          result="$(xcrun notarytool submit "$dmg" --wait --output-format json \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")"
          printf '%s\n' "$result"
          jq -e '.status == "Accepted"' <<< "$result"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Publish the verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/MiniMail-$version-mac-arm64.dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
